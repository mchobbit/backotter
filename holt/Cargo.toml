[package]
name = "bko-holt"
version = "0.2.6"
edition = "2024"
rust-version = "1.85"
# `cargo run` without --bin: bko-holt, as before there were two.
default-run = "bko-holt"
description = "Record a Linux system's disk layout and boot setup as JSON, and rebuild disks from it"
license = "GPL-3.0-or-later"
publish = false

# No dependencies on purpose: it builds offline with Debian's own cargo, and
# every on-disk format it reads is parsed (and unit-tested) here.
[dependencies]

[lib]
name = "bko_holt"
path = "src/lib.rs"

[[bin]]
name = "bko-holt"
path = "src/main.rs"

# A program to try recovery keys (src/recovery.rs) by hand.  Built with the
# rest, but not shipped: build-holt.sh and the images take bko-holt alone.
[[bin]]
name = "bko-recovery-words"
path = "src/bin/bko-recovery-words.rs"

[profile.release]
lto = true
strip = true

# The lint policy (RustAudit1 RA3, decision D3; docs/design/rust-audit.md).
# The parser modules add their own restriction lints at the top of each file.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
# missing_docs (RA3) waits for the docs RA7 writes: 723 items today, and as a
# rustc lint it would print on every build; the audit's runs pass it.
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
# The default groups stay at their own level; pedantic read finding by finding.
pedantic = { level = "warn", priority = -1 }
# Nearly every getter; noise for a CLI's library.
must_use_candidate = "allow"
# probe::luks::LuksHeader and the like read well.
module_name_repetitions = "allow"
# On-disk field names (s_blocks, s_block) mirror the formats.
similar_names = "allow"
# Each unsafe block a SAFETY comment, one unsafe operation per block.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
