[package]
name = "bko-holt"
version = "0.2.4"
edition = "2021"
rust-version = "1.85"
description = "Record a Linux system's disk layout and boot setup as JSON, and rebuild disks from it"
license = "GPL-3.0-or-later"
publish = false

# No dependencies on purpose: it builds offline with Debian's own cargo, and
# every on-disk format it reads is parsed (and unit-tested) here.
[dependencies]

[lib]
name = "bko_holt"
path = "src/lib.rs"

[[bin]]
name = "bko-holt"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
