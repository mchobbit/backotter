[package]
name = "bko-laydump"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Dump a Debian 13 system's disk layout and boot setup as JSON"
publish = false

# No dependencies on purpose: it builds offline with Debian's own cargo, and
# every on-disk format it reads is parsed (and unit-tested) here.
[dependencies]

[[bin]]
name = "bko-laydump"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
