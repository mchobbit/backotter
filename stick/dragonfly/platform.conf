# DragonFly BSD, for make-img-bsd.sh: the rescue image is the system on
# DragonFly's official USB image, made read-only and given BackOtter's console,
# and built in a throwaway copy of the dragonfly6 test guest
# (testvm/make-dragonfly.sh).  See dragonfly/README.md.

BASE_OS=dragonfly
BASE_RELEASE=6.4.2
CONFIG_PART=3
BUILD_VM=dragonfly6
BUILD_VM_IMAGE=dragonfly6.qcow2
BUILD_VM_PORT=${BUILD_VM_PORT:-2420}
BUILD_VM_MODE=snapshot
BUILD_VM_OPTIONS=(--memory 4096 --cpus 4)
# rustic-bko is cross-built for it (dragonfly/build-rustic.sh): the image
# needs both binaries.
RUSTIC_REQUIRED=yes

DFLY_MIRROR=https://mirror-master.dragonflybsd.org/iso-images
DFLY_IMG=dfly-x86_64-${BASE_RELEASE}_REL.img

# DragonFly publishes no signatures, nor any checksum stronger than MD5: the
# mirror's md5.txt, fetched over HTTPS, is all there is to check against.
# build.sh checks the uncompressed image against it too.
fetch() {
    local dir=$1 want got
    if [[ ! -f $dir/md5.txt ]]; then
        curl -fsS -o "$dir/md5.txt.part" "$DFLY_MIRROR/md5.txt" || die "couldn't download $DFLY_MIRROR/md5.txt"
        mv "$dir/md5.txt.part" "$dir/md5.txt"
    fi
    if [[ ! -f $dir/$DFLY_IMG.bz2 ]]; then
        echo "Downloading $DFLY_MIRROR/$DFLY_IMG.bz2"
        curl -fS -C - -o "$dir/$DFLY_IMG.bz2.part" "$DFLY_MIRROR/$DFLY_IMG.bz2" ||
            die "couldn't download $DFLY_MIRROR/$DFLY_IMG.bz2"
        mv "$dir/$DFLY_IMG.bz2.part" "$dir/$DFLY_IMG.bz2"
    fi
    want=$(sed -n "s/^MD5 ($DFLY_IMG.bz2) = //p" "$dir/md5.txt")
    got=$(md5sum "$dir/$DFLY_IMG.bz2" | cut -d' ' -f1)
    [[ -n $want ]] || die "$dir/md5.txt has no $DFLY_IMG.bz2"
    # Removed, so that the next run downloads it again.
    [[ $got == "$want" ]] || { rm "$dir/$DFLY_IMG.bz2"; die "$DFLY_IMG.bz2 didn't match md5.txt; removed it"; }
    MEDIA=("$DFLY_IMG.bz2" md5.txt)
}
