# FreeBSD's rescue image, for make-img-bsd.sh (see its header): remastered
# from the official memstick inside the long-lived FreeBSD builder VM.
# shellcheck shell=bash

FREEBSD_VERSION=15.1
BASE_OS=freebsd
BASE_RELEASE=$FREEBSD_VERSION-RELEASE
CONFIG_PART=3                   # MBR slice 3, after the ESP and the root slice
BUILD_VM=freebsd15-builder      # see testvm/freebsd/builder-setup.sh
BUILD_VM_IMAGE=freebsd15.qcow2
BUILD_VM_PORT=2400
BUILD_VM_MODE=running

# Colin Percival, FreeBSD release engineering lead, who signs the release
# announcements; listed in https://docs.freebsd.org/pgpkeys/pgpkeys.txt.
# As in testvm/make-freebsd.sh: FreeBSD publishes no signed checksum file, so
# the image's checksum comes from the signed announcement.
FREEBSD_RE_KEY=82563B84D0620EDC0DFB86413897F2E22E65AD3F
FREEBSD_KEYSERVER=hkps://keyserver.ubuntu.com

# fetch MEDIA_DIR: download the memstick and the release announcement into
# MEDIA_DIR unless they're there already, and check the memstick against it.
# Needs wget, gpg, gpgv and sha256sum.
fetch() {
    local dir=$1 v=$FREEBSD_VERSION
    local img=FreeBSD-$v-RELEASE-amd64-memstick.img announce=announce-$v.asc
    local keyring=freebsd-re-key.gpg signed want gnupg
    _fetch_get "https://www.freebsd.org/releases/${v}R/announce.asc" "$dir/$announce"
    _fetch_get "https://download.freebsd.org/releases/amd64/amd64/ISO-IMAGES/$v/$img" "$dir/$img"
    if [[ ! -s $dir/$keyring ]]; then
        # Fetched by full fingerprint, so the keyserver can't substitute a key.
        gnupg=$(mktemp -d)
        GNUPGHOME=$gnupg gpg -q --keyserver "$FREEBSD_KEYSERVER" --recv-keys "$FREEBSD_RE_KEY" &&
            GNUPGHOME=$gnupg gpg -q --export "$FREEBSD_RE_KEY" >"$dir/$keyring.part" ||
            { rm -rf "$gnupg"; die "couldn't fetch the release engineer's key $FREEBSD_RE_KEY"; }
        rm -rf "$gnupg"
        mv "$dir/$keyring.part" "$dir/$keyring"
    fi
    # Only the signed text counts: gpgv writes it out, without anything an
    # attacker might have added around the signature.
    signed=$(gpgv --keyring "$dir/$keyring" --output - "$dir/$announce" 2>/dev/null) ||
        die "$announce is not signed by $FREEBSD_RE_KEY"
    want=$(sed -n "s/^ *SHA256 ($img) = \([0-9a-f]\{64\}\)\$/\1/p" <<<"$signed")
    [[ -n $want ]] || die "$announce lists no SHA256 for $img"
    (cd "$dir" && echo "$want  $img" | sha256sum -c --quiet -) || die "$img does not match $announce"
    MEDIA=("$img")
}

_fetch_get() {   # URL FILE
    [[ -f $2 && ! -f $2.part ]] && return
    echo "Downloading $1"
    touch "$2.part"
    wget -c -q -O "$2" "$1" || die "could not download $1"
    rm "$2.part"
}
