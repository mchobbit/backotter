# Haiku, for make-img-bsd.sh: the rescue image is the system on Haiku's
# official anyboot image (R1/beta6), given BackOtter's console and rustic-bko,
# and built in a throwaway copy of the haiku6 test guest (testvm/make-haiku.sh).
# See haiku/README.md.

BASE_OS=haiku
BASE_RELEASE=r1beta6
CONFIG_PART=3
BUILD_VM=haiku6
BUILD_VM_IMAGE=haiku6.qcow2
BUILD_VM_PORT=${BUILD_VM_PORT:-2440}
BUILD_VM_MODE=snapshot
BUILD_VM_OPTIONS=(--memory 4096 --cpus 4)
# Haiku has no root: its only user, "user", is uid 0.  Its shutdown has no -p.
BUILD_VM_USER=user
BUILD_VM_POWEROFF='shutdown -q'
# Haiku's own console and remote-access replace stick/bsd's (same names).
BUILD_FILES=(console remote-access boot on-serial.py mbr.py)
# Restic isn't ported to Haiku (its Go is too old): the image has rustic-bko
# only, built natively (haiku/build-rustic.sh).
RESTIC_REQUIRED=no
RUSTIC_REQUIRED=yes

HAIKU_URL=https://haiku-release.cdn.haiku-os.org/$BASE_RELEASE
HAIKU_IMG=haiku-$BASE_RELEASE-x86_64-anyboot.iso
# haiku-2019.pub, as testvm/make-haiku.sh has it.
HAIKU_KEY=RWTPfbfFRi5b+T02aw733p5dp/UI/1Z946YWBInmkPmBlx2Zy1Vyw9kP

# The anyboot image and its minisign signature.  The haiku6 guest's copy is
# used where there is one (a symlink, not a 1.4 GB copy); either way it is
# checked against the signature here.
fetch() {
    local dir=$1 f guest=$WORK/vms/haiku6
    for f in "$HAIKU_IMG.minisig" "$HAIKU_IMG"; do
        [[ -e $dir/$f ]] && continue
        if [[ -f $guest/$f ]]; then
            ln -s "$guest/$f" "$dir/$f"
            continue
        fi
        echo "Downloading $HAIKU_URL/$f"
        curl -fS -C - -o "$dir/$f.part" "$HAIKU_URL/$f" || die "couldn't download $HAIKU_URL/$f"
        mv "$dir/$f.part" "$dir/$f"
    done
    minisign -Vqm "$dir/$HAIKU_IMG" -x "$dir/$HAIKU_IMG.minisig" -P "$HAIKU_KEY" ||
        die "$HAIKU_IMG doesn't match its signature"
    MEDIA=("$HAIKU_IMG")
}
