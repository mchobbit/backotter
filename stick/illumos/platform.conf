# illumos, for make-img-bsd.sh: the rescue image is an OmniOS r151058 system
# that boots into RAM, built from OmniOS's signed packages with OmniOS's own
# image tools (kayak, at a pinned commit) in a throwaway copy of the omnios58
# test guest (testvm/make-omnios.sh).  See illumos/README.md.

BASE_OS=omnios
BASE_RELEASE=r151058
# After OmniOS's own USB layout (ESP, boot, root), as GPT partition 4.
CONFIG_PART=4
BUILD_VM=omnios58
BUILD_VM_IMAGE=omnios58.qcow2
BUILD_VM_PORT=${BUILD_VM_PORT:-2430}
BUILD_VM_MODE=snapshot
BUILD_VM_OPTIONS=(--memory 6144 --cpus 4)
# illumos' shutdown has no -p.
BUILD_VM_POWEROFF=/usr/sbin/poweroff
BUILD_FILES=(mkgpt.py pkglist.backotter keep.backotter services.backotter
    console.xml network.xml on-tty net-up)
# rustic-bko is built natively for it (illumos/build-rustic.sh): the image
# needs both binaries.
RUSTIC_REQUIRED=yes

# kayak, OmniOS's tools for its install media, from its r151058 branch.  The
# git commit is the check: git verifies every object it fetches against it.
KAYAK_REPO=https://github.com/omniosorg/kayak
KAYAK_BRANCH=r151058
KAYAK_COMMIT=fea434000598ec3a32058d5d7cf477f9065d44c6

fetch() {
    local dir=$1 tar=kayak-${KAYAK_COMMIT:0:7}.tar
    if [[ ! -f $dir/$tar ]]; then
        echo "Fetching kayak $KAYAK_COMMIT from $KAYAK_REPO"
        rm -rf "$dir/kayak.git"
        git clone -q --bare --filter=blob:none "$KAYAK_REPO" "$dir/kayak.git" ||
            die "couldn't clone $KAYAK_REPO"
        git -C "$dir/kayak.git" merge-base --is-ancestor "$KAYAK_COMMIT" "refs/heads/$KAYAK_BRANCH" ||
            die "kayak commit $KAYAK_COMMIT isn't on its $KAYAK_BRANCH branch"
        git -C "$dir/kayak.git" archive --prefix=kayak/ "$KAYAK_COMMIT" >"$dir/$tar.part" ||
            die "couldn't make $tar"
        mv "$dir/$tar.part" "$dir/$tar"
        rm -rf "$dir/kayak.git"
    fi
    MEDIA=("$tar")
}
