# BackOtter rescue stick: tty2-tty6 log root straight into a shell.  Anyone at
# the console of a machine booted from the stick already controls it; remote
# access is the line that needs a password (see /usr/lib/backotter/remote-access).
[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty --noreset --noclear --autologin root - ${TERM}
