# BackOtter rescue stick: tty1 runs BackOtter's console instead of a login.
# Sorts after 50-backotter-root-shell.conf, so its ExecStart wins on tty1.
# agetty restarts it whenever it exits.
[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty --noreset --noclear --autologin root --login-program /usr/lib/backotter/console - ${TERM}
