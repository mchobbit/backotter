# BackOtter rescue stick: a serial console (console=ttyS0 on the kernel command
# line, e.g. for IPMI serial-over-LAN) gets BackOtter's console too.
[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty --noreset --noclear --autologin root --login-program /usr/lib/backotter/console --keep-baud 115200,57600,38400,9600 - ${TERM}
