# NetBSD's rescue image, for make-img-bsd.sh (bash, sourced).  See README.md.

BASE_OS=netbsd
BASE_RELEASE=11.0
CONFIG_PART=3
# The NetBSD test guest (testvm/make-netbsd.sh 11.0 vms/netbsd11), booted as
# a throwaway copy.  Ports 2410-2419 are this image's on Cinqcent.
BUILD_VM=netbsd11
BUILD_VM_IMAGE=netbsd11.qcow2
BUILD_VM_PORT=${BKO_NETBSD_PORT:-2410}
BUILD_VM_MODE=snapshot
BUILD_VM_OPTIONS=(--memory 4096 --cpus 4)

# The sets that make up the image.  Not comp, games, man, tests, text or X.
NETBSD_SETS=(base etc kern-GENERIC misc modules rescue)
NETBSD_MIRROR=https://cdn.netbsd.org/pub/NetBSD
# "NetBSD Security Officer 2019 Key <security-officer@NetBSD.org>", as in
# testvm/make-netbsd.sh: it signs each release's hash list.
NETBSD_KEY=271133262BF35CB50D4F504689261E17F5EF49FF

# fetch MEDIA_DIR: the sets, each checked against the release's hash list
# signed by the NetBSD Security Officer.  EXTRA_SETS (space-separated) adds
# more, e.g. comp for a build VM.
fetch() {
    local dir=$1 set file want hashes gnupg
    (
        cd "$dir" || exit 1
        get() {     # get URL FILE: download unless already complete
            [[ -f $2 && ! -f $2.part ]] && return
            echo "Downloading $1"
            touch "$2.part"
            wget -c -q -O "$2" "$1" || die "could not download $1"
            rm "$2.part"
        }
        get "$NETBSD_MIRROR/security/hashes/NetBSD-${BASE_RELEASE}_hashes.asc" hashes.asc
        if [[ ! -s netbsd-key.gpg ]]; then
            # By full fingerprint, so the keyserver can't substitute a key.
            gnupg=$(mktemp -d)
            GNUPGHOME=$gnupg gpg -q --keyserver hkps://keyserver.ubuntu.com --recv-keys "$NETBSD_KEY"
            GNUPGHOME=$gnupg gpg -q --export "$NETBSD_KEY" >netbsd-key.gpg.new
            rm -rf "$gnupg"
            mv netbsd-key.gpg.new netbsd-key.gpg
        fi
        hashes=$(gpgv --keyring ./netbsd-key.gpg --output - hashes.asc 2>/dev/null) ||
            die "NetBSD-${BASE_RELEASE}_hashes.asc is not signed by the NetBSD Security Officer"
        # shellcheck disable=SC2086
        for set in "${NETBSD_SETS[@]}" ${EXTRA_SETS:-}; do
            file=$set.tar.xz
            get "$NETBSD_MIRROR/NetBSD-$BASE_RELEASE/amd64/binary/sets/$file" "$file"
            want=$(sed -n "s|^SHA512 (NetBSD-$BASE_RELEASE/amd64/binary/sets/$file) = ||p" <<<"$hashes")
            # A bad file goes, so the next run downloads it again.
            [[ -n $want && $(sha512sum "$file" | cut -d' ' -f1) == "$want" ]] ||
                { rm -f "$file"; die "$file does not match the signed hash list"; }
        done
    ) || exit 1
    MEDIA=()
    for set in "${NETBSD_SETS[@]}"; do MEDIA+=("$set.tar.xz"); done
}
