# OpenBSD's rescue image, for make-img-bsd.sh (bash, sourced there).  See
# README.md here.
BASE_OS=openbsd
BASE_RELEASE=8.0
# MBR slot 1: slot 0 is the ESP, slot 3 OpenBSD's own (its disklabel).
CONFIG_PART=2
# A throwaway copy of the test guest that testvm/make-openbsd.sh makes.
BUILD_VM=openbsd8
BUILD_VM_IMAGE=openbsd8.qcow2
BUILD_VM_PORT=${BUILD_VM_PORT:-2431}
BUILD_VM_MODE=snapshot
BUILD_VM_OPTIONS=(--memory 6144 --cpus 2)
# The release's base key, which signs its SHA256.sig, from
# https://www.openbsd.org/80.html (as in testvm/make-openbsd.sh).
BASE_KEY=RWSMSt0erHTctUxq2JDAgQRo64ztikp8JvQeiSPte3NZ0Geou0TkTEiE
BASE_URL=https://cdn.openbsd.org/pub/OpenBSD/$BASE_RELEASE/amd64
# The release's errata, as syspatch installs them: the release's syspatch key
# (base80.tgz's /etc/signify/openbsd-80-syspatch.pub) signs the list.
SYSPATCH_KEY=RWQAeCccO9yAASmUJSCJEW9C5WOP/GAsa5dhMtPPmb5pehzPO7EAmqhK
SYSPATCH_URL=https://cdn.openbsd.org/pub/OpenBSD/syspatch/$BASE_RELEASE/amd64

# The kernel and the base set, checked against the release's signed
# SHA256.sig.  Taken from the build VM's install ISO when it has one (the
# guest was installed from it, and its SHA256.sig checked then), otherwise
# downloaded.  The sets in either are the release as shipped, without errata;
# then the syspatches published so far, as syspatch-SHA256.sig (their signed
# list, fetched afresh every time) and syspatchNN-*.tgz.  build.sh applies
# them.
fetch() {
    fetch_release "$1"
    fetch_syspatches "$1"
}
fetch_release() {
    local dir=$1 r=${BASE_RELEASE/./} iso=$WORK/vms/$BUILD_VM/install${BASE_RELEASE/./}.iso
    local signify f
    signify=$(command -v signify-openbsd || command -v signify) ||
        die "signify is missing (Debian: signify-openbsd)"
    MEDIA=(SHA256.sig "base$r.tgz" bsd.mp)
    printf 'untrusted comment: openbsd %s base public key\n%s\n' "$BASE_RELEASE" "$BASE_KEY" \
        >"$dir/base.pub"
    if (cd "$dir" && "$signify" -C -q -p base.pub -x SHA256.sig "${MEDIA[@]:1}") 2>/dev/null; then
        return
    fi
    if [[ -f $iso && -f ${iso%/*}/SHA256.sig ]]; then
        echo "Taking base$r.tgz and bsd.mp from $iso"
        cp "${iso%/*}/SHA256.sig" "$dir/"
        for f in "${MEDIA[@]:1}"; do
            rm -f "$dir/$f"
            xorriso -osirrox on -indev "$iso" -extract "/$BASE_RELEASE/amd64/$f" "$dir/$f" \
                2>/dev/null || die "$iso lacks /$BASE_RELEASE/amd64/$f"
        done
    else
        for f in "${MEDIA[@]}"; do
            echo "Downloading $BASE_URL/$f"
            wget -q -O "$dir/$f" "$BASE_URL/$f" || die "could not download $BASE_URL/$f"
        done
    fi
    (cd "$dir" && "$signify" -C -q -p base.pub -x SHA256.sig "${MEDIA[@]:1}") ||
        die "base$r.tgz or bsd.mp doesn't match SHA256.sig, or it isn't signed by $BASE_KEY"
}
fetch_syspatches() {
    local dir=$1 r=${BASE_RELEASE/./} signify f patches
    signify=$(command -v signify-openbsd || command -v signify)
    printf 'untrusted comment: openbsd %s syspatch public key\n%s\n' "$BASE_RELEASE" "$SYSPATCH_KEY" \
        >"$dir/syspatch.pub"
    echo "Downloading $SYSPATCH_URL/SHA256.sig"
    wget -q -O "$dir/syspatch-SHA256.sig.part" "$SYSPATCH_URL/SHA256.sig" ||
        die "could not download $SYSPATCH_URL/SHA256.sig"
    "$signify" -V -q -e -p "$dir/syspatch.pub" -x "$dir/syspatch-SHA256.sig.part" -m /dev/null ||
        die "$SYSPATCH_URL/SHA256.sig isn't signed by $SYSPATCH_KEY"
    mv "$dir/syspatch-SHA256.sig.part" "$dir/syspatch-SHA256.sig"
    mapfile -t patches < <(sed -n "s/^SHA256 (\(syspatch$r-[0-9]*_[A-Za-z0-9_]*\.tgz\)) = [0-9a-f]*\$/\1/p" \
        "$dir/syspatch-SHA256.sig" | sort)
    for f in "${patches[@]}"; do
        (cd "$dir" && "$signify" -C -q -p syspatch.pub -x syspatch-SHA256.sig "$f") 2>/dev/null && continue
        echo "Downloading $SYSPATCH_URL/$f"
        wget -q -O "$dir/$f" "$SYSPATCH_URL/$f" || die "could not download $SYSPATCH_URL/$f"
    done
    if [[ ${#patches[@]} -gt 0 ]]; then
        (cd "$dir" && "$signify" -C -q -p syspatch.pub -x syspatch-SHA256.sig "${patches[@]}") ||
            die "a syspatch doesn't match its signed SHA256.sig"
    fi
    echo "${#patches[@]} syspatches for $BASE_RELEASE"
    MEDIA+=(syspatch-SHA256.sig "${patches[@]}")
}
