# Debian 12.0 test guest for BackOtter: an unattended install from the
# official 12.0.0 DVD-1, offline, so the result is exactly 12.0.  BIOS + MBR
# with /boot, swap and / as three primary partitions, no desktop.
#
# make-debian12.sh appends this to the installer's initrd, replacing
# @ROOT_PASSWORD_HASH@ first, and adds /authorized_keys beside it.

# Locale and keyboard (read from the initrd before the installer asks).
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network: DHCP from QEMU's user-mode network; used for nothing but naming.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string deb12
d-i netcfg/get_domain string test
d-i netcfg/hostname string deb12
d-i hw-detect/load_firmware boolean false

# Packages from the DVD only: no mirror and no security updates, and the
# DVD's own apt entry commented out afterwards, so the system stays 12.0.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-double boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/disable-cdrom-entries boolean true

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean false

# Only root, with a generated password; make-debian12.sh keeps it and an SSH
# key for root next to the disk image.
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password-crypted password @ROOT_PASSWORD_HASH@

# The disk: MBR, /boot 1 GB, swap 2 GB, / ext4 for the rest.
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-partitioning/default_label string msdos
d-i partman-auto/expert_recipe string \
    backotter :: \
        1024 1024 1024 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /boot } \
        . \
        2048 2048 2048 linux-swap \
            $primary{ } \
            method{ swap } format{ } \
        . \
        4096 8192 -1 ext4 \
            $primary{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        .
d-i partman-auto/choose_recipe select backotter
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# A plain server: standard utilities and an SSH server, no desktop.
d-i base-installer/kernel/image string linux-image-amd64
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/vda

d-i preseed/late_command string \
    mkdir -p -m 700 /target/root/.ssh; \
    cp /authorized_keys /target/root/.ssh/authorized_keys; \
    chmod 600 /target/root/.ssh/authorized_keys

# Power off when done; make-debian12.sh waits for QEMU to exit.
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false
d-i debian-installer/exit/poweroff boolean true
