# Fedora atomic (ostree) test guest for BackOtter: an unattended Kickstart
# install from the official Server DVD's installer, whose payload is a
# bootable container image pulled over the guest's network instead of the
# DVD's packages.  The disk layout is storage-ostree.ks's.
#
# make-fedora.sh --ostree fills in the @...@ settings (the storage line with
# that file) and serves this file over HTTP to the installer (inst.ks=).

text
# The image by digest, so the install is exactly what make-fedora.sh
# resolved and recorded.  Fedora's images carry no signature the installer
# could check.
ostreecontainer --url=@IMAGE_URL@ --no-signature-verification
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --hostname=@HOSTNAME@ --activate
firstboot --disable
skipx
# The atomic desktops ship sshd disabled.  mcelog decodes Intel machine
# checks only: on the hosts' AMD CPUs under KVM it fails at every boot (the
# Server guests leave its package out, which an image can't).
services --enabled=sshd --disabled=mcelog

# Only root, with a generated password, and an SSH key for root (in
# /var/roothome/.ssh); make-fedora.sh keeps both next to the disk image.
rootpw --iscrypted @ROOT_PASSWORD_HASH@
sshkey --username=root "@AUTHORIZED_KEY@"

@STORAGE@

poweroff
