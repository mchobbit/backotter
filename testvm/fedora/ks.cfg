# Fedora Server test guest for BackOtter: an unattended Kickstart install from
# an official Server DVD, offline.  The disk layout is storage-bios.ks's or,
# for UEFI, storage-uefi.ks's.
#
# make-fedora.sh fills in the @...@ settings (the storage line with one of
# those files) and serves this file over HTTP to the installer (inst.ks=).

text
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --hostname=@HOSTNAME@ --activate
firstboot --disable
skipx

# Only root, with a generated password, and an SSH key for root;
# make-fedora.sh keeps both next to the disk image.
rootpw --iscrypted @ROOT_PASSWORD_HASH@
sshkey --username=root "@AUTHORIZED_KEY@"

@STORAGE@

%packages
@^server-product-environment
%end

# Freeze the guest at this release, like the others: the "fedora" repository
# never changes after release; the update repositories do, so turn them off.
%post --erroronfail
for f in /etc/yum.repos.d/fedora-updates*.repo; do
    sed -i 's/^enabled=1/enabled=0/' "$f"
done
! grep -h '^enabled=1' /etc/yum.repos.d/fedora-updates*.repo
%end

poweroff
