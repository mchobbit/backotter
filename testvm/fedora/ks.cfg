# Fedora Server test guest for BackOtter: an unattended Kickstart install from
# an official Server DVD, offline.  BIOS + MBR with /boot (ext4), swap, and a
# btrfs volume laid out the way Fedora's own installer does it: subvolumes
# "root" (/) and "home" (/home) on a volume labelled "fedora".
#
# make-fedora.sh fills in the @...@ settings and serves this file over HTTP to
# the installer (inst.ks=).

text
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --hostname=@HOSTNAME@ --activate
firstboot --disable
skipx

# Only root, with a generated password, and an SSH key for root;
# make-fedora.sh keeps both next to the disk image.
rootpw --iscrypted @ROOT_PASSWORD_HASH@
sshkey --username=root "@AUTHORIZED_KEY@"

zerombr
clearpart --all --initlabel --disklabel=msdos --drives=vda
part /boot --fstype=ext4 --size=1024 --asprimary --ondisk=vda
part swap --size=2048 --asprimary --ondisk=vda
part btrfs.01 --fstype=btrfs --size=4096 --grow --asprimary --ondisk=vda
btrfs none --label=fedora btrfs.01
btrfs / --subvol --name=root fedora
btrfs /home --subvol --name=home fedora
# A serial console too, as on the other test guests.
bootloader --location=mbr --boot-drive=vda --append="console=tty0 console=ttyS0,115200n8"

%packages
@^server-product-environment
%end

# Freeze the guest at this release, like the others: the "fedora" repository
# never changes after release; the update repositories do, so turn them off.
%post --erroronfail
for f in /etc/yum.repos.d/fedora-updates*.repo; do
    sed -i 's/^enabled=1/enabled=0/' "$f"
done
! grep -h '^enabled=1' /etc/yum.repos.d/fedora-updates*.repo
%end

poweroff
