# pc-sysinstall(8) configuration for a BackOtter GhostBSD test guest: what
# Install Station (GhostBSD's graphical installer) writes to
# /tmp/ghostbsd_installation.cfg, for one disk wiped whole.  make-ghostbsd.sh
# fills in the placeholders and puts this on the install media as
# /backotter/pcinstall.cfg, which install.sh runs.

installMode=fresh
installInteractive=no
installType=GhostBSD
# The system is the live one, copied over with cpdup, as Install Station does.
installMedium=livezfs
packageType=livezfs

# For zfs: pool "zroot", boot environment "default", Install Station's.
zpoolName=zroot
beName=default
ashift=12

# GPT with a BIOS boot partition (freebsd-boot, and the pmbr), as the guest
# boots with SeaBIOS.  bootManager=none: no boot0 menu.
disk0=vtbd0
partition=ALL
bootManager=none
efiLoader=none
partscheme=GPT
commitDiskPart

# Sizes in MB, 0 for the rest: / (@ROOT_FS@), then swap; pc-sysinstall
# wants / first.  For ufs: soft updates and TRIM (pc-sysinstall's newfs -t),
# which vm-run --discard turns into unallocated clusters; not the journal
# (UFS+SUJ), whose file the copy deletes, as it's not in the live system,
# so that / then can't be mounted read-write.  For zfs: Install Station's
# datasets.
disk0-part=@ROOT_PART@
disk0-part=SWAP 2048 none
commitDiskLabel

hostname=@HOSTNAME@

# No desktop, sshd and root's key: see post-install.sh.
runScript=/tmp/bko/post-install.sh
