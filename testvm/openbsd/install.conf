# autoinstall(8) response file for a BackOtter OpenBSD test guest.
# make-openbsd.sh fills in the placeholders and serves it to the installer.
# Each line answers the installer question that starts with its left side;
# questions not listed here get the installer's default (the whole disk,
# MBR).  The disk gets openbsd/disklabel's layout, / and swap: OpenBSD's own
# automatic layout splits a 16 GB disk so finely that /usr can't hold the
# sets.
System hostname = @HOSTNAME@
Password for root account = @ROOT_PASSWORD@
Public ssh key for root account = @AUTHORIZED_KEY@
Allow root ssh login = prohibit-password
Start sshd(8) by default = yes
Do you expect to run the X Window System = no
Change the default console to com0 = yes
Which speed should com0 use = 115200
Network interfaces = vio0
IPv4 address for vio0 = autoconf
IPv6 address for vio0 = none
Setup a user = no
What timezone are you in = UTC
Which disk is the root disk = sd0
URL to autopartitioning template for disklabel = @DISKLABEL_URL@
Location of sets = cd0
Set name(s) = -x* -game*
# The CD has only an unsigned SHA256 list; make-openbsd.sh has already
# checked the whole ISO against the signed SHA256.sig from the mirror.
Directory does not contain SHA256.sig. Continue without verification = yes
