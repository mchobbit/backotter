# The installer's menu for make-qubes.sh's prepared ISO: both copies of
# Qubes's own (/EFI/BOOT/grub.cfg and BOOT.conf, in the ISO9660 tree and in
# images/efiboot.img) are replaced by this one entry.  Unlike the stock
# menu, Xen's console is com1 (not console=none) and dom0's hvc0, Anaconda
# runs in text mode from the kickstart on the QUBES_OEM disk, and dom0 gets
# initcall_blacklist=print_s5_reset_status_mmio, without which it panics on
# the farm's AMD Zen hosts (docs/design/qubes.md, "What Q0 found").  The
# prepared ISO is named by this file's SHA-256: change it and make-qubes.sh
# makes a new one.
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set default=0
set timeout=3
function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}
load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod part_msdos
insmod ext2
search --no-floppy --set=root -l QUBES-R4-3-2-X86-64
menuentry "BackOtter: install Qubes OS from the QUBES_OEM kickstart, consoles on serial" {
    multiboot2 /images/pxeboot/xen.gz console=com1 com1=115200,8n1 loglvl=all guest_loglvl=all noreboot
    module2 /images/pxeboot/vmlinuz inst.repo=hd:LABEL=QUBES-R4-3-2-X86-64 console=hvc0 inst.text inst.ks=hd:LABEL=QUBES_OEM initcall_blacklist=print_s5_reset_status_mmio
    module2 /images/pxeboot/initrd.img
}
