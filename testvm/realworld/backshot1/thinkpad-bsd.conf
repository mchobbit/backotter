# BackShot1's FreeBSD lane on the Lenovo A100 (docs/design/freebsd-bs1.md).
# The driver reads it with BS1_CONF=thinkpad-bsd.conf; stage copies it to the
# lane drive as bs1.conf.  Plain assignments: bs1-lane reads it under sh too.
LANE_OS=freebsd
SOURCE_HOST=thinkpad
INTERNAL_SERIAL=S7XMNF0Y787118
# The lane drive: one GPT partition, UFS2 (SU+J) labelled so, so it is
# /dev/ufs/BS1BSD on the installed system and on the stick (Q1: the label
# may still change).  Its FreeBSD ident (diskinfo -v) once the user has named
# the drive and said yes to formatting it (F3).
BACKUP_LABEL=BS1BSD
LANE_SERIAL=
# The FreeBSD rescue stick's FreeBSD ident (F2).
STICK_SERIAL=
# mybig512, which no FreeBSD step may touch (D3): its USB bridge's serial as
# Linux reports it (FreeBSD's da(4) ident may differ), and its GPT partitions'
# GUIDs, read on Linux (lsblk -o PARTUUID) at the next Linux block.
NEVER_SERIAL=012345678921
NEVER_PARTUUIDS=""
