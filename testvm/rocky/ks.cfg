# Rocky Linux test guest for BackOtter (Rocky is a rebuild of Red Hat
# Enterprise Linux): an unattended Kickstart install from an official minimal
# ISO, offline.  BIOS + MBR with /boot, swap and / as three primary
# partitions, XFS (RHEL's default; RHEL's kernel has no JFS), no desktop.
#
# make-rocky.sh fills in the @...@ settings and serves this file over HTTP to
# the installer (inst.ks=).

text
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --hostname=@HOSTNAME@ --activate
firstboot --disable
skipx

# Only root, with a generated password, and an SSH key for root;
# make-rocky.sh keeps both next to the disk image.
rootpw --iscrypted @ROOT_PASSWORD_HASH@
sshkey --username=root "@AUTHORIZED_KEY@"

# The disk: MBR, /boot 1 GiB, swap 2 GiB, / for the rest, all XFS.
zerombr
clearpart --all --initlabel --disklabel=msdos --drives=vda
part /boot --fstype=xfs --size=1024 --asprimary --ondisk=vda
part swap --size=2048 --asprimary --ondisk=vda
part / --fstype=xfs --size=4096 --grow --asprimary --ondisk=vda
# A serial console too, as on the other test guests.
bootloader --location=mbr --boot-drive=vda --append="console=tty0 console=ttyS0,115200n8"

%packages
@^minimal-environment
%end

# Freeze the guest at this point release, like the Debian and Arch guests:
# Rocky's mirrors only carry the latest minor release, so point every
# repository at the vault's copy of this one.
%post --erroronfail
sed -i -e 's/^mirrorlist=/#mirrorlist=/' \
    -e 's|^#baseurl=http://dl.rockylinux.org/$contentdir/$releasever/|baseurl=https://dl.rockylinux.org/vault/rocky/@VERSION@/|' \
    /etc/yum.repos.d/rocky*.repo
# Fail the install rather than leave repositories with no URL at all.
grep -q '^baseurl=https://dl.rockylinux.org/vault/rocky/@VERSION@/BaseOS/' /etc/yum.repos.d/rocky.repo
! grep -q '^mirrorlist=' /etc/yum.repos.d/rocky*.repo
%end

poweroff
