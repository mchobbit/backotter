  # Four disks, UEFI, as Subiquity's manual storage screen makes "RAID 10
  # with LVM" when every disk is a boot device: GPT on each, with
  #   1  1 GiB  an EFI system partition (FAT32); the first disk's is
  #             /boot/efi, the others aren't mounted.  Each is a grub_device,
  #             so curtin lists all four in grub-efi/install_devices and GRUB
  #             keeps them alike (grub-multi-install), as Ubuntu does
  #   2  rest   a member of md0: md RAID10 (mdadm's default near-2 layout),
  #             the PV of volume group ubuntu-vg, with the logical volumes
  #             swap (2 GiB) and ubuntu-lv (ext4, /) for the rest
  # /boot is on /: GRUB reads LVM on md RAID10.  The late commands wait for
  # md0's first resync (storage-raid-late.yaml).
  storage:
    config:
      - {type: disk, id: disk0, path: /dev/vda, ptable: gpt, wipe: superblock-recursive, preserve: false}
      - {type: disk, id: disk1, path: /dev/vdb, ptable: gpt, wipe: superblock-recursive, preserve: false}
      - {type: disk, id: disk2, path: /dev/vdc, ptable: gpt, wipe: superblock-recursive, preserve: false}
      - {type: disk, id: disk3, path: /dev/vdd, ptable: gpt, wipe: superblock-recursive, preserve: false}
      - {type: partition, id: esp0, device: disk0, number: 1, size: 1G, flag: boot, grub_device: true, preserve: false}
      - {type: partition, id: esp1, device: disk1, number: 1, size: 1G, flag: boot, grub_device: true, preserve: false}
      - {type: partition, id: esp2, device: disk2, number: 1, size: 1G, flag: boot, grub_device: true, preserve: false}
      - {type: partition, id: esp3, device: disk3, number: 1, size: 1G, flag: boot, grub_device: true, preserve: false}
      - {type: format, id: fmt-esp0, volume: esp0, fstype: fat32, preserve: false}
      - {type: format, id: fmt-esp1, volume: esp1, fstype: fat32, preserve: false}
      - {type: format, id: fmt-esp2, volume: esp2, fstype: fat32, preserve: false}
      - {type: format, id: fmt-esp3, volume: esp3, fstype: fat32, preserve: false}
      - {type: partition, id: part-md0, device: disk0, number: 2, size: -1, preserve: false}
      - {type: partition, id: part-md1, device: disk1, number: 2, size: -1, preserve: false}
      - {type: partition, id: part-md2, device: disk2, number: 2, size: -1, preserve: false}
      - {type: partition, id: part-md3, device: disk3, number: 2, size: -1, preserve: false}
      - {type: raid, id: md0, name: md0, raidlevel: 10,
         devices: [part-md0, part-md1, part-md2, part-md3], preserve: false}
      - {type: lvm_volgroup, id: vg0, name: ubuntu-vg, devices: [md0], preserve: false}
      - {type: lvm_partition, id: lv-swap, volgroup: vg0, name: swap, size: 2G, preserve: false}
      - {type: lvm_partition, id: lv-root, volgroup: vg0, name: ubuntu-lv, preserve: false}
      - {type: format, id: fmt-swap, volume: lv-swap, fstype: swap, preserve: false}
      - {type: format, id: fmt-root, volume: lv-root, fstype: ext4, preserve: false}
      - {type: mount, id: mnt-root, device: fmt-root, path: /}
      - {type: mount, id: mnt-esp0, device: fmt-esp0, path: /boot/efi}
      - {type: mount, id: mnt-swap, device: fmt-swap, path: none}
